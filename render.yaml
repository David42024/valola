databases:
  - name: valola-db
    databaseName: valola
    user: valola
    plan: free

services:
  - type: web
    name: valola-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: fastapi
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: valola-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_ENVIRONMENT
        sync: false
      - key: ENVIRONMENT
        value: production